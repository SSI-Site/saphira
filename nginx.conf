# nginx/nginx.conf

upstream saphira_app {
    server saphira-api-prod:8000;
}

server {

    listen 80;

    location /static/ {
        alias /app/static/;
    }

    location / {
        proxy_pass http://saphira_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

}
