name: Django CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env.test with enviroment variables
        run: |
          echo "SAPHIRA_ENV=${{vars.SAPHIRA_ENV}}" >> .env.test
          echo "SAPHIRA_JWT_SECRET_KEY=${{ secrets.SAPHIRA_JWT_SECRET_KEY }}" >> .env.test
          echo "SAPHIRA_ALLOWED_HOSTS=${{ vars.SAPHIRA_ALLOWED_HOSTS }}" >> .env.test
          echo "POSTGRES_DB=action-db" >> .env.test
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env.test
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env.test
          echo "POSTGRES_HOST=database-test" >> .env.test
          echo "POSTGRES_PORT=5432" >> .env.test
      - name: Add firebase-key.json from secrets
        run: |
          echo '${{ secrets.FIREBASE_SECRETS }}' > firebase-key.json
      - name: Run docker compose in test profile
        env:
          COMPOSE_BAKE: true
        run: |
          docker compose --profile test up --build --exit-code-from tests
